<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/home/$USER/terminal</title>
    <style>
        :root {
            --bg: #1e1e2e;
            --fg: #cdd6f4;
            --green: #a6e3a1;
            --blue: #89b4fa;
            --yellow: #f9e2af;
            --red: #f38ba8;
            --gray: #6c7086;
            --border: #45475a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            overflow: hidden;
        }

        .output {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 0.5rem;
        }

        .output::-webkit-scrollbar { width: 8px; }
        .output::-webkit-scrollbar-track { background: transparent; }
        .output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .line { white-space: pre-wrap; word-break: break-word; }

        .prompt-line {
            display: flex;
            align-items: baseline;
            gap: 0;
        }

        .ps1-user { color: var(--green); }
        .ps1-at { color: var(--fg); }
        .ps1-host { color: var(--blue); }
        .ps1-path { color: var(--yellow); }
        .ps1-dollar { color: var(--fg); margin-right: 0.5rem; }

        .input-row {
            display: flex;
            align-items: baseline;
        }

        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--fg);
            font-family: inherit;
            font-size: inherit;
            caret-color: var(--green);
        }

        .text-green { color: var(--green); }
        .text-blue { color: var(--blue); }
        .text-yellow { color: var(--yellow); }
        .text-red { color: var(--red); }
        .text-gray { color: var(--gray); }

        .banner {
            color: var(--green);
            font-size: 11px;
            line-height: 1.3;
            white-space: pre;
            margin-bottom: 0.5rem;
        }

        .help-table {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.3rem 1.5rem;
            margin: 0.5rem 0;
        }

        .help-cmd { color: var(--blue); }
        .help-desc { color: var(--fg); }

        a { color: var(--blue); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="output" id="output"></div>
        <div class="input-row">
            <span class="ps1-user">viewer</span><span class="ps1-at">@</span><span class="ps1-host">not-so-local_host</span><span class="ps1-path">:~$</span>
            <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const input = document.getElementById('cmd-input');
        let history = [];
        let historyIndex = -1;

        const banner = `
██████╗ ███████╗███╗   ███╗ ██████╗     ███████╗██╗████████╗███████╗
██╔══██╗██╔════╝████╗ ████║██╔═══██╗    ██╔════╝██║╚══██╔══╝██╔════╝
██║  ██║█████╗  ██╔████╔██║██║   ██║    ███████╗██║   ██║   █████╗  
██║  ██║██╔══╝  ██║╚██╔╝██║██║   ██║    ╚════██║██║   ██║   ██╔══╝  
██████╔╝███████╗██║ ╚═╝ ██║╚██████╔╝    ███████║██║   ██║   ███████╗
╚═════╝ ╚══════╝╚═╝     ╚═╝ ╚═════╝     ╚══════╝╚═╝   ╚═╝   ╚══════╝
                                                                    
`;

        const commands = {
            help: () => `
Available commands:
<span class="help-table">
<span class="help-cmd">help</span><span class="help-desc">show this help message</span>
<span class="help-cmd">about</span><span class="help-desc">info about me</span>
<span class="help-cmd">whoami</span><span class="help-desc">who am i?</span>
<span class="help-cmd">social</span><span class="help-desc">social links</span>
<span class="help-cmd">projects</span><span class="help-desc">check out my projects</span>
<span class="help-cmd">banner</span><span class="help-desc">display the banner</span>
<span class="help-cmd">date</span><span class="help-desc">current date & time</span>
<span class="help-cmd">clear</span><span class="help-desc">clear the terminal</span>
<span class="help-cmd">sudo</span><span class="help-desc">you shall not pass</span>
</span>`,

            about: () => `
<span class="text-green">about:</span>
  I build things, break things, and occasionally fix them.
  Currently exploring web dev, systems, and over-engineering.
  Based in Australia. Coffee-powered.`,

            whoami: () => `<span class="text-blue">visitor</span> — you're so lost right now XD.`,

            social: () => `
<span class="text-green">social:</span>
  github   → <a href="https://github.com/iz4c810" target="_blank">github.com/iz4c810</a>
  email    → <a href="mailto:izc7050@gmail.com">izc7050@gmail.com</a>`,

            projects: () => `
<span class="text-green">projects:</span>
  <a href="#">project-a/</a>   — Live Fastfetch built in C++
  <a href="#">project-b/</a>   — This Site XD
  <a href="#">project-c/</a>   — Gonna be a Caelestia dots plugin
  <a href="#">notes.txt</a>    — ramblings`,

            banner: () => `<span class="banner">${banner}</span>`,

            date: () => new Date().toString(),

            clear: () => { output.innerHTML = ''; return null; },

            sudo: () => `<span class="text-red">visitor is not in the sudoers file. This incident will be reported.</span>`,
        };

        function print(html) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = html;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function printPrompt(cmd) {
            const div = document.createElement('div');
            div.className = 'line';
            div.innerHTML = `<span class="ps1-user">visitor</span><span class="ps1-at">@</span><span class="ps1-host">host</span><span class="ps1-path">:~$</span> ${cmd}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function execute(cmd) {
            const trimmed = cmd.trim();
            if (!trimmed) return;

            history.push(trimmed);
            historyIndex = history.length;

            printPrompt(trimmed);

            const parts = trimmed.split(/\s+/);
            const cmdName = parts[0].toLowerCase();

            if (commands[cmdName]) {
                const result = commands[cmdName]();
                if (result !== null) print(result);
            } else {
                print(`<span class="text-red">command not found:</span> ${cmdName} <span class="text-gray">— try 'help'</span>`);
            }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                execute(input.value);
                input.value = '';
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    input.value = history[historyIndex];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIndex < history.length - 1) {
                    historyIndex++;
                    input.value = history[historyIndex];
                } else {
                    historyIndex = history.length;
                    input.value = '';
                }
            }
        });

        // Click anywhere to focus input
        document.addEventListener('click', () => input.focus());

        // Initial output
        print(`<span class="banner">${banner}</span>`);
        print(`<span class="text-gray">Last login: ${new Date().toString()} from 127.0.0.1</span>`);
        print(`<span class="text-gray">Type </span>'help'<span class="text-gray"> to get started.</span>`);
    </script>
</body>
</html>
