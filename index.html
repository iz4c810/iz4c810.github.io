<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallpaper Base</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="topbar">
    <h1>Wallpaper Base</h1>
    <nav>
      <button onclick="ui.openUpload()">+ Add</button>
      <button class="theme-toggle" onclick="theme.toggle()">Toggle Theme</button>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search wallpapers…" oninput="ui.filter(this.value)">
      <select id="sort" onchange="wallpaper.sort(this.value)">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>
    <div id="gallery" class="grid"></div>
  </main>

  <!-- Upload Modal -->
  <dialog id="upload-modal">
    <form method="dialog" onsubmit="wallpaper.add(event)">
      <h2>Add Wallpaper</h2>
      <input type="text" name="title" placeholder="Title" required>
      <input type="text" name="tags" placeholder="Tags (comma-separated)">
      <input type="file" name="image" accept="image/*" required>
      <div class="modal-actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Preview Modal -->
  <dialog id="preview-modal">
    <div class="preview-body">
      <img id="preview-img" src="" alt="">
      <p id="preview-meta"></p>
      <div class="modal-actions">
        <button onclick="ui.closePreview()">Close</button>
        <button class="danger" onclick="wallpaper.delete()">Delete</button>
      </div>
    </div>
  </dialog>

  <script src="js/theme.js"></script>
  <script src="js/wallpaper.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
