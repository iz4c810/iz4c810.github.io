<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guest@dfs:~$</title>
<style>
  :root{
    --bg:      #282828;
    --bg-soft: #32302f;
    --fg:      #ebdbb2;
    --fg-dim:  #a89984;
    --red:     #fb4934;
    --green:   #b8bb26;
    --yellow:  #fabd2f;
    --blue:    #83a598;
    --purple:  #d3869b;
    --aqua:    #8ec07c;
    --orange:  #fe8019;
    --gray:    #665c54;
    --border:  #504945;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body{
    height:100%;
    background: radial-gradient(ellipse at top left, #32302f 0%, #282828 60%);
    color: var(--fg);
  }

  body{
    font-family: 'JetBrains Mono','Fira Code',ui-monospace,'Courier New',monospace;
    font-size: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 2.5vh 2vw;
  }

  .window{
    position:relative;
    width: min(920px, 100%);
    height: min(640px, 92vh);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.2);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }

  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:#fb4934; }
  .dot.y{ background:#fabd2f; }
  .dot.g{ background:#b8bb26; }

  .titletext{
    flex:1;
    text-align:center;
    color: var(--fg-dim);
    font-size:12px;
    letter-spacing: 0.3px;
    margin-right: 54px;
  }

  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding: 18px 20px;
    overflow:hidden;
  }

  .output{
    flex:1;
    overflow-y:auto;
    padding-right: 6px;
  }

  .output::-webkit-scrollbar{ width:9px; }
  .output::-webkit-scrollbar-track{ background:transparent; }
  .output::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }

  .line{ white-space:pre-wrap; word-break:break-word; margin-bottom: 2px; }
  .block{ margin: 4px 0 14px; }

  .ps1{ display:flex; align-items:baseline; flex-wrap:wrap; }
  .ps1-user{ color: var(--aqua); font-weight:600; }
  .ps1-sep{ color: var(--fg-dim); }
  .ps1-host{ color: var(--yellow); font-weight:600; }
  .ps1-path{ color: var(--blue); }
  .ps1-sign{ color: var(--fg-dim); margin-right: 8px; }

  .input-row{ display:flex; align-items:baseline; flex-shrink:0; padding-top: 6px; }
  .input-row input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--fg);
    font: inherit;
    caret-color: var(--green);
  }

  .c-red{ color: var(--red); }
  .c-green{ color: var(--green); }
  .c-yellow{ color: var(--yellow); }
  .c-blue{ color: var(--blue); }
  .c-purple{ color: var(--purple); }
  .c-aqua{ color: var(--aqua); }
  .c-orange{ color: var(--orange); }
  .c-dim{ color: var(--fg-dim); }
  .c-fg{ color: var(--fg); }
  .c-gray{ color: var(--gray); }
  .bold{ font-weight:700; }

  a{ color: var(--blue); text-decoration: none; border-bottom: 1px dotted var(--gray); }
  a:hover{ color: var(--yellow); border-bottom-color: var(--yellow); }

  .banner{ color: var(--orange); font-size:10px; line-height:1.25; white-space:pre; }

  .help-grid{
    display:grid;
    grid-template-columns: max-content 1fr;
    gap: 3px 22px;
    margin: 4px 0;
  }
  .help-cmd{ color: var(--yellow); }
  .help-desc{ color: var(--fg-dim); }

  .fetch{
    display:flex;
    gap: 26px;
    align-items:flex-start;
    flex-wrap: wrap;
  }
  .fetch-art{
    color: var(--aqua);
    font-size: 10px;
    line-height: 1.15;
    white-space: pre;
    flex-shrink:0;
  }
  .fetch-info{ min-width: 220px; }
  .fetch-title{ color: var(--yellow); font-weight:700; margin-bottom:2px; }
  .fetch-rule{ color: var(--gray); margin-bottom: 5px; }
  .fetch-row{ display:flex; gap: 8px; }
  .fetch-key{ color: var(--purple); width: 88px; flex-shrink:0; }
  .fetch-val{ color: var(--fg); }
  .swatches{ display:flex; gap:4px; margin-top:8px; }
  .swatch{ width:16px; height:11px; border-radius:2px; }

  ul.plain{ list-style:none; }
  ul.plain li{ margin: 2px 0; }

  .cursor{
    display:inline-block;
    width: 7px;
    height: 15px;
    background: var(--green);
    margin-left: 2px;
    vertical-align: -2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .vim-overlay{
    position:absolute; inset:0;
    background: var(--bg);
    display:none;
    flex-direction:column;
    z-index:40;
  }
  .vim-body{ flex:1; overflow:hidden; padding: 10px 0 0 0; }
  .vim-line{ display:flex; }
  .vim-lineno{ width:38px; text-align:right; padding-right:10px; color: var(--gray); flex-shrink:0; user-select:none; }
  .vim-text{ color: var(--fg); white-space:pre; }
  .vim-tilde{ color: var(--blue); }
  .vim-hint{
    position:absolute; left:0; right:0; bottom: 40px;
    text-align:center; color: var(--yellow); font-size:12px;
    opacity:0; transition: opacity .5s;
  }
  .vim-hint.show{ opacity:1; }
  .vim-statusbar{
    background: var(--bg-soft);
    border-top:1px solid var(--border);
    padding: 4px 12px;
    display:flex; justify-content:space-between;
    color: var(--fg-dim); font-size:12px; flex-shrink:0;
  }
  .vim-cmdline{ padding: 3px 12px; color: var(--fg); font-size:13px; min-height:20px; flex-shrink:0; }

  .matrix-overlay{
    position:absolute; inset:0;
    z-index:45;
    display:none;
    width:100%; height:100%;
  }

  @media (max-width: 640px){
    body{ padding:0; }
    .window{ width:100%; height:100vh; border-radius:0; }
    .fetch{ flex-direction:column; }
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="titletext">guest@dfs — 80x24</span>
    </div>
    <div class="screen">
      <div class="output" id="output"></div>
      <div class="input-row">
        <span class="ps1">
          <span class="ps1-user">guest</span><span class="ps1-sep">@</span><span class="ps1-host">dfs</span><span class="ps1-sep">:</span><span class="ps1-path" id="live-path">~</span><span class="ps1-sign">$</span>
        </span>
        <input type="text" id="cmd-input" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
      </div>
    </div>

    <div class="vim-overlay" id="vim-overlay">
      <div class="vim-body" id="vim-body"></div>
      <div class="vim-hint" id="vim-hint">type <b>:q</b> then Enter to exit</div>
      <div class="vim-statusbar">
        <span id="vim-filename">"[No Name]"</span>
        <span>NORMAL</span>
      </div>
      <div class="vim-cmdline" id="vim-cmdline"></div>
    </div>

    <canvas class="matrix-overlay" id="matrix-canvas"></canvas>
  </div>

<script>
const output = document.getElementById('output');
const input  = document.getElementById('cmd-input');
let hist = [];
let histIdx = -1;

const banner =
`8b    d8 88     88 88     88     8b    d8b    d8
88b  d88 88     88 88     88     88b  d888b  d88
88YbdP88 88  YbdP  88  YbdP  YbdP88 YbdP88 YbdP88
88 YY 88 88   d8    Yb  d8    d888888 8888 888888
88    88 88888888888888888888888  88  888  88  88`;

// ---------------------------------------------------------------------
// fake filesystem
// ---------------------------------------------------------------------
const fs = {
  type: 'dir',
  children: {
    'projects': { type: 'dir', children: {
      'live-fastfetch': { type: 'dir', children: {
        'readme.md': { type: 'file', content: 'A fastfetch clone written in C++. Renders system info faster than it needs to.' }
      }},
      'this-site': { type: 'dir', children: {
        'readme.md': { type: 'file', content: "You're standing in it. Try 'ls' around, or 'vim' something." }
      }},
      'caelestia-plugin': { type: 'dir', children: {
        'readme.md': { type: 'file', content: 'WIP plugin for the Caelestia dotfiles rice. Ask again later.' }
      }}
    }},
    'notes.txt': { type: 'file', content: '2am thought: every dotfile rewrite makes the prompt 3ms faster and my life 10 minutes shorter.' },
    '.secret': { type: 'file', content: "you found it. there's no prize, just the satisfaction of 'ls -a'." }
  }
};
let cwd = []; // path segments from fs root, [] = home (~)

function resolveDir(pathSegs){
  let node = fs;
  for (const seg of pathSegs){
    if (!node.children || !node.children[seg] || node.children[seg].type !== 'dir') return null;
    node = node.children[seg];
  }
  return node;
}

function pathStr(){
  return cwd.length === 0 ? '~' : '~/' + cwd.join('/');
}

function updateLivePrompt(){
  document.getElementById('live-path').textContent = pathStr();
}

function promptTag(cmd){
  return `<span class="ps1"><span class="ps1-user">guest</span><span class="ps1-sep">@</span>`
       + `<span class="ps1-host">dfs</span><span class="ps1-sep">:</span><span class="ps1-path">${pathStr()}</span>`
       + `<span class="ps1-sign">$</span></span> ${escapeHtml(cmd)}`;
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function print(html){
  const div = document.createElement('div');
  div.className = 'line block';
  div.innerHTML = html;
  output.appendChild(div);
  scrollDown();
}

function printLine(html){
  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = html;
  output.appendChild(div);
  scrollDown();
}

function scrollDown(){ output.scrollTop = output.scrollHeight; }

function stripTags(html){
  return String(html)
    .replace(/<[^>]*>/g, '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .trim();
}

let secretUnlocked = false;

// ---------------------------------------------------------------------
// commands
// ---------------------------------------------------------------------
const commands = {

  help: () => `
<span class="help-grid">
  <span class="help-cmd">about</span><span class="help-desc">who's behind the prompt</span>
  <span class="help-cmd">fastfetch [--ascii name]</span><span class="help-desc">system info (cat, fish, ghost, skull)</span>
  <span class="help-cmd">whoami</span><span class="help-desc">identify the current user (you)</span>
  <span class="help-cmd">whoareu</span><span class="help-desc">identify me</span>
  <span class="help-cmd">projects</span><span class="help-desc">things I've built</span>
  <span class="help-cmd">skills</span><span class="help-desc">tools and languages I reach for</span>
  <span class="help-cmd">contact</span><span class="help-desc">ways to reach me</span>
  <span class="help-cmd">ls [-a]</span><span class="help-desc">list the current directory</span>
  <span class="help-cmd">cd &lt;dir&gt;</span><span class="help-desc">change directory</span>
  <span class="help-cmd">cat &lt;file&gt;</span><span class="help-desc">print a file</span>
  <span class="help-cmd">vim &lt;file&gt;</span><span class="help-desc">open a file (good luck)</span>
  <span class="help-cmd">echo, cowsay</span><span class="help-desc">pipe-friendly, try 'echo hi | cowsay'</span>
  <span class="help-cmd">matrix</span><span class="help-desc">unplug for a moment</span>
  <span class="help-cmd">banner</span><span class="help-desc">reprint the header</span>
  <span class="help-cmd">date</span><span class="help-desc">current date and time</span>
  <span class="help-cmd">history</span><span class="help-desc">commands run this session</span>
  <span class="help-cmd">clear</span><span class="help-desc">clear the screen</span>
  <span class="help-cmd">sudo &lt;anything&gt;</span><span class="help-desc">try it and see</span>
</span>`,

  about: () => `
<span class="c-yellow bold">about</span>
<span class="c-gray">──────────────────────────────</span>
I'm a developer who spends more time customizing the terminal
than actually using it for work. Based in Australia, mostly
nocturnal, powered by coffee and the occasional rice of my
desktop.

Right now I split time between web projects, small C++ tools,
and tweaking my Linux setup one config file at a time. If it
has a dotfile, I've probably rewritten it twice.`,

  whoami: () => `<span class="c-blue">guest</span> <span class="c-dim">— unauthenticated, but welcome anyway.</span>`,

  whoareu: () => `<span class="c-aqua">iz4c810</span> <span class="c-dim">— the one writing this terminal, not the one reading it.</span>`,

  fastfetch: (arg) => {
    let asciiName = 'cat';
    if (arg){
      const m = arg.match(/--ascii\s+(\S+)/);
      if (m) asciiName = m[1].toLowerCase();
    }
    const arts = {
      cat:
`    .--.
   |o_o |
   |:_/ |
  //   \\ \\
 (|     | )
/'\\_   _/\`\\
\\___)=(___/`,
      fish:
`     ,
   ><(((o>
    ~~~~`,
      ghost:
`  .-""""-.
 /        \\
|  ^    ^  |
|          |
 \\  ~~~~  /
  '.____.'
   / | \\
  ^  |  ^`,
      skull:
`  .-""""""-.
.'          '.
|   O    O   |
|             |
:  \\______/   :
 \\           /
  '.       .'
    '-...-'`,
    };
    const art = arts[asciiName] || arts.cat;
    return `
<span class="fetch">
  <span class="fetch-art">${art}</span>
  <span class="fetch-info">
    <div class="fetch-title">guest@dfs</div>
    <div class="fetch-rule">-----------------</div>
    <div class="fetch-row"><span class="fetch-key">OS</span><span class="fetch-val">HumanOS (Sydney build)</span></div>
    <div class="fetch-row"><span class="fetch-key">Host</span><span class="fetch-val">this-website v1</span></div>
    <div class="fetch-row"><span class="fetch-key">Uptime</span><span class="fetch-val">${uptimeSince()}</span></div>
    <div class="fetch-row"><span class="fetch-key">Shell</span><span class="fetch-val">curiosity --interactive</span></div>
    <div class="fetch-row"><span class="fetch-key">Editor</span><span class="fetch-val">Neovim, unless it's 2am</span></div>
    <div class="fetch-row"><span class="fetch-key">WM</span><span class="fetch-val">Caelestia (in progress)</span></div>
    <div class="fetch-row"><span class="fetch-key">Terminal</span><span class="fetch-val">this exact page</span></div>
    <div class="fetch-row"><span class="fetch-key">CPU</span><span class="fetch-val">4x espresso shots</span></div>
    <div class="fetch-row"><span class="fetch-key">Memory</span><span class="fetch-val">mostly full of shortcuts</span></div>
    <div class="swatches">
      <span class="swatch" style="background:#fb4934"></span>
      <span class="swatch" style="background:#fabd2f"></span>
      <span class="swatch" style="background:#b8bb26"></span>
      <span class="swatch" style="background:#83a598"></span>
      <span class="swatch" style="background:#d3869b"></span>
      <span class="swatch" style="background:#8ec07c"></span>
      <span class="swatch" style="background:#fe8019"></span>
      <span class="swatch" style="background:#ebdbb2"></span>
    </div>
  </span>
</span>`;
  },
  neofetch: (arg) => commands.fastfetch(arg),

  projects: () => `
<span class="c-yellow bold">projects</span>
<span class="c-gray">──────────────────────────────</span>
<ul class="plain">
  <li><a href="#" onclick="return false;">live-fastfetch/</a> <span class="c-dim">— a fastfetch clone written in C++</span></li>
  <li><a href="#" onclick="return false;">this-site/</a>      <span class="c-dim">— the page you're looking at</span></li>
  <li><a href="#" onclick="return false;">caelestia-plugin/</a><span class="c-dim">— a plugin for the Caelestia dotfiles, WIP</span></li>
  <li><a href="#" onclick="return false;">notes.txt</a>        <span class="c-dim">— unsorted ramblings, run 'cat notes.txt'</span></li>
${secretUnlocked ? `  <li><a href="#" onclick="return false;">infinite-coffee/</a> <span class="c-orange">— unlocked via cheat code, not actually real</span></li>\n` : ''}</ul>`,

  ls: (arg) => {
    const dir = resolveDir(cwd);
    if (!dir) return `<span class="c-red">ls:</span> <span class="c-dim">cannot access current directory</span>`;
    const showAll = (arg || '').trim() === '-a';
    const names = Object.keys(dir.children || {}).filter(n => showAll || !n.startsWith('.'));
    if (!names.length) return `<span class="c-dim">(empty)</span>`;
    return names.map(name => {
      const child = dir.children[name];
      return child.type === 'dir'
        ? `<span class="c-blue">${escapeHtml(name)}/</span>`
        : `<span class="c-fg">${escapeHtml(name)}</span>`;
    }).join('  ');
  },

  cd: (arg) => {
    const target = (arg || '').trim();
    if (!target || target === '~'){ cwd = []; return null; }
    const parts = target.split('/').filter(Boolean);
    const newCwd = [...cwd];
    for (const part of parts){
      if (part === '.') continue;
      if (part === '..'){ if (newCwd.length) newCwd.pop(); continue; }
      if (part === '~'){ newCwd.length = 0; continue; }
      const dir = resolveDir(newCwd);
      const child = dir && dir.children ? dir.children[part] : null;
      if (child && child.type === 'dir'){
        newCwd.push(part);
      } else {
        return `<span class="c-red">cd:</span> ${escapeHtml(part)}: <span class="c-dim">No such file or directory</span>`;
      }
    }
    cwd = newCwd;
    return null;
  },

  'cat': (arg) => {
    const name = (arg || '').trim();
    if (!name) return `<span class="c-red">cat:</span> <span class="c-dim">missing file operand</span>`;
    const dir = resolveDir(cwd);
    const node = dir && dir.children ? dir.children[name] : null;
    if (!node) return `<span class="c-red">cat:</span> ${escapeHtml(name)}: <span class="c-dim">No such file or directory</span>`;
    if (node.type === 'dir') return `<span class="c-red">cat:</span> ${escapeHtml(name)}: <span class="c-dim">Is a directory</span>`;
    return `<span class="c-dim">${escapeHtml(node.content)}</span>`;
  },

  vim: (arg) => {
    const name = (arg || '').trim();
    if (!name){ openVim('[No Name]', ''); return null; }
    const dir = resolveDir(cwd);
    const node = dir && dir.children ? dir.children[name] : null;
    if (node && node.type === 'dir'){
      return `<span class="c-red">vim:</span> ${escapeHtml(name)}: <span class="c-dim">Is a directory</span>`;
    }
    openVim(name, node ? node.content : '');
    return null;
  },
  nvim: (arg) => commands.vim(arg),

  echo: (arg) => escapeHtml(arg || ''),

  cowsay: (arg) => {
    const raw = (arg && arg.trim()) ? arg.trim() : 'moo';
    const width = Math.min(Math.max(raw.length, 4), 40);
    const text = raw.length > width ? raw.slice(0, width) : raw;
    const pad = text.length < width ? text + ' '.repeat(width - text.length) : text;
    const cow = [
      ' ' + '_'.repeat(width + 2),
      `< ${pad} >`,
      ' ' + '-'.repeat(width + 2),
      '        \\   ^__^',
      '         \\  (oo)\\_______',
      '            (__)\\       )\\/\\',
      '                ||----w |',
      '                ||     ||'
    ].join('\n');
    return `<span class="c-dim">${escapeHtml(cow)}</span>`;
  },

  matrix: () => {
    runMatrix();
    return `<span class="c-dim">wake up, guest…</span>`;
  },

  skills: () => `
<span class="c-yellow bold">skills</span>
<span class="c-gray">──────────────────────────────</span>
<span class="c-aqua">languages</span>   C++, JavaScript, Python, Bash
<span class="c-aqua">web</span>         HTML/CSS, vanilla JS, a healthy distrust of frameworks
<span class="c-aqua">systems</span>     Linux internals, dotfiles, window managers
<span class="c-aqua">currently</span>  learning Rust, slowly rewriting things in it`,

  contact: () => `
<span class="c-yellow bold">contact</span>
<span class="c-gray">──────────────────────────────</span>
github   → <a href="https://github.com/iz4c810" target="_blank" rel="noopener">github.com/iz4c810</a>
email    → <a href="mailto:izc7050@gmail.com">izc7050@gmail.com</a>`,

  social: () => commands.contact(),

  banner: () => `<span class="banner">${banner}</span>\n<span class="c-dim">type 'help' to see what's available.</span>`,

  date: () => new Date().toString(),

  history: () => {
    if (!hist.length) return `<span class="c-dim">no commands yet.</span>`;
    return hist.map((h,i)=>`  ${String(i+1).padStart(3,' ')}  ${escapeHtml(h)}`).join('\n');
  },

  clear: () => { output.innerHTML = ''; return null; },

  sudo: (rest) => {
    if ((rest || '').trim().toLowerCase() === 'make me a sandwich'){
      return `<span class="c-green">Okay.</span> <span class="c-dim">(sudo makes anything possible)</span>`;
    }
    return `<span class="c-red">guest is not in the sudoers file. This incident will be reported.</span>`;
  },
};

const bootTime = Date.now();
function uptimeSince(){
  const s = Math.max(0, Math.floor((Date.now() - bootTime) / 1000));
  return s < 60 ? `${s}s` : `${Math.floor(s/60)}m ${s%60}s`;
}

// ---------------------------------------------------------------------
// vim trap
// ---------------------------------------------------------------------
let vimActive = false;
let vimBuffer = '';
let vimHintTimer = null;

function openVim(filename, content){
  vimActive = true;
  const body = document.getElementById('vim-body');
  const linesArr = (content || '').split('\n');
  const totalRows = 18;
  let html = '';
  for (let i = 0; i < totalRows; i++){
    if (i < linesArr.length){
      html += `<div class="vim-line"><span class="vim-lineno">${i+1}</span><span class="vim-text">${escapeHtml(linesArr[i])}</span></div>`;
    } else {
      html += `<div class="vim-line"><span class="vim-lineno"></span><span class="vim-tilde">~</span></div>`;
    }
  }
  body.innerHTML = html;
  document.getElementById('vim-filename').textContent = `"${filename}" ${linesArr.length}L`;
  document.getElementById('vim-cmdline').textContent = '';
  document.getElementById('vim-hint').classList.remove('show');
  document.getElementById('vim-overlay').style.display = 'flex';
  input.disabled = true;
  vimBuffer = '';
  clearTimeout(vimHintTimer);
  vimHintTimer = setTimeout(() => {
    if (vimActive) document.getElementById('vim-hint').classList.add('show');
  }, 2500);
}

function closeVim(){
  vimActive = false;
  document.getElementById('vim-overlay').style.display = 'none';
  clearTimeout(vimHintTimer);
  input.disabled = false;
  input.focus();
  printLine(`<span class="c-dim">(exited vim)</span>`);
}

document.addEventListener('keydown', (e) => {
  if (!vimActive) return;
  e.preventDefault();
  const cmdEl = document.getElementById('vim-cmdline');

  if (e.key === 'Escape'){
    vimBuffer = '';
    cmdEl.textContent = '';
    return;
  }
  if (e.key.toLowerCase() === 'z' && vimBuffer === ''){
    vimBuffer = 'Z';
    cmdEl.textContent = '';
    setTimeout(() => { if (vimBuffer === 'Z') vimBuffer = ''; }, 600);
    return;
  }
  if (e.key.toLowerCase() === 'z' && vimBuffer === 'Z'){
    closeVim();
    return;
  }
  if (e.key === ':' && vimBuffer === ''){
    vimBuffer = ':';
    cmdEl.textContent = vimBuffer;
    return;
  }
  if (vimBuffer.startsWith(':')){
    if (e.key === 'Enter'){
      const cmd = vimBuffer;
      if (/^:(q|q!|wq|wq!|x)$/.test(cmd)){
        closeVim();
      } else {
        cmdEl.textContent = `E492: Not an editor command: ${cmd.slice(1)}`;
        vimBuffer = '';
        setTimeout(() => { if (vimActive) cmdEl.textContent = ''; }, 1500);
      }
      return;
    }
    if (e.key === 'Backspace'){
      vimBuffer = vimBuffer.length > 1 ? vimBuffer.slice(0, -1) : ':';
      cmdEl.textContent = vimBuffer;
      return;
    }
    if (e.key.length === 1){
      vimBuffer += e.key;
      cmdEl.textContent = vimBuffer;
    }
  }
});

// ---------------------------------------------------------------------
// matrix effect
// ---------------------------------------------------------------------
function runMatrix(){
  const canvas = document.getElementById('matrix-canvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const fontSize = 14;
  const columns = Math.max(1, Math.floor(canvas.width / fontSize));
  const drops = new Array(columns).fill(1);
  const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789';
  const green = getComputedStyle(document.documentElement).getPropertyValue('--green').trim() || '#b8bb26';

  const interval = setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = green;
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++){
      const ch = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }, 50);

  setTimeout(() => {
    clearInterval(interval);
    canvas.style.display = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }, 4000);
}

// ---------------------------------------------------------------------
// execution: single commands + pipes
// ---------------------------------------------------------------------
function execSingle(trimmed){
  const parts = trimmed.split(/\s+/);
  const name = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');
  if (commands[name]){
    const res = commands[name](arg);
    if (res !== null && res !== undefined) print(res);
  } else {
    print(`<span class="c-red">command not found:</span> ${escapeHtml(name)} <span class="c-dim">— try 'help'</span>`);
  }
}

function runPipeline(segments){
  let carry = null;
  let lastRes = undefined;
  for (let i = 0; i < segments.length; i++){
    const parts = segments[i].split(/\s+/);
    const name = parts[0].toLowerCase();
    let arg = parts.slice(1).join(' ');
    if (i > 0 && carry !== null){
      arg = arg ? `${carry} ${arg}` : carry;
    }
    if (!commands[name]){
      print(`<span class="c-red">command not found:</span> ${escapeHtml(name)} <span class="c-dim">— try 'help'</span>`);
      return;
    }
    lastRes = commands[name](arg);
    carry = lastRes == null ? '' : stripTags(lastRes);
  }
  if (lastRes !== null && lastRes !== undefined) print(lastRes);
}

function run(raw){
  const trimmed = raw.trim();
  if (!trimmed) return;

  hist.push(trimmed);
  histIdx = hist.length;

  printLine(promptTag(trimmed));

  const segments = trimmed.split('|').map(s => s.trim()).filter(Boolean);
  if (segments.length > 1){
    runPipeline(segments);
  } else {
    execSingle(trimmed);
  }
  updateLivePrompt();
}

input.addEventListener('keydown', (e) => {
  if (vimActive) return;
  if (e.key === 'Enter'){
    run(input.value);
    input.value = '';
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    if (histIdx > 0){ histIdx--; input.value = hist[histIdx]; }
  } else if (e.key === 'ArrowDown'){
    e.preventDefault();
    if (histIdx < hist.length - 1){ histIdx++; input.value = hist[histIdx]; }
    else { histIdx = hist.length; input.value = ''; }
  } else if (e.key === 'Tab'){
    e.preventDefault();
    const cur = input.value.trim();
    const match = Object.keys(commands).find(c => c.startsWith(cur) && cur.length);
    if (match) input.value = match;
  }
});

document.addEventListener('click', () => { if (!vimActive) input.focus(); });

// ---------------------------------------------------------------------
// hidden konami code easter egg
// ---------------------------------------------------------------------
const konamiSeq = ['arrowup','arrowup','arrowdown','arrowdown','arrowleft','arrowright','arrowleft','arrowright','b','a'];
let konamiPos = 0;

document.addEventListener('keydown', (e) => {
  if (vimActive) return;
  const k = e.key.toLowerCase();
  if (k === konamiSeq[konamiPos]){
    konamiPos++;
    if (konamiPos === konamiSeq.length){
      konamiPos = 0;
      if (!secretUnlocked){
        secretUnlocked = true;
        printLine(`<span class="c-orange">✦ cheat code accepted — infinite coffee granted. run 'projects' again.</span>`);
      }
    }
  } else {
    konamiPos = (k === konamiSeq[0]) ? 1 : 0;
  }
});

// boot sequence
// ---------------------------------------------------------------------
function delay(ms){ return new Promise(res => setTimeout(res, ms)); }

async function bootSequence(){
  input.disabled = true;
  const lines = [
    'Starting guest session…',
    'Mounting ~/projects',
    'Loading gruvbox palette',
    'Starting fastfetch daemon',
    'Reticulating splines…',
    'Boot complete',
  ];
  for (const line of lines){
    await delay(140);
    printLine(`<span class="c-green">[ OK ]</span> <span class="c-dim">${line}</span>`);
  }
  print(`<span class="banner">${banner}</span>`);
  printLine(`<span class="c-dim">Welcome. Last login: ${new Date().toString()}</span>`);
  printLine(`<span class="c-dim">Type </span><span class="c-yellow">help</span><span class="c-dim"> to see available commands, or try </span><span class="c-yellow">fastfetch</span><span class="c-dim">.</span>`);
  input.disabled = false;
  input.focus();
}

bootSequence();
